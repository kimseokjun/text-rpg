name: Admin · 계정 확인
on:
  workflow_dispatch:
    inputs:
      username:
        description: '확인할 아이디'
        required: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 계정 조회
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          NAME: ${{ inputs.username }}
        run: |
          # 아이디는 SQL 리터럴로 안전하게 이스케이프
          ESC=$(printf "%s" "$NAME" | sed "s/'/''/g")
          Q="select p.username, p.created_at::date as joined, s.day, (s.data->>'maxFloor')::int as max_floor, s.power, s.updated_at::date as saved from public.profiles p left join public.saves s on s.user_id = p.id where lower(p.username) = lower('$ESC')"
          BODY=$(jq -n --arg q "$Q" '{query: $q}')
          curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY" | tee out.json
          echo
          if [ "$(jq 'length' out.json 2>/dev/null)" = "0" ]; then echo "결과: 없는 아이디"; else echo "결과: 있음"; fi
